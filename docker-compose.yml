# CasaOS / Raspberry Pi — avvio: docker compose up -d --build
# Porta 3001 per non confliggere con UniStrategy (:3000).
#
# Storage su SanDisk: crea le cartelle sul Pi prima del primo avvio:
#   sudo mkdir -p /mnt/FotoSanDisk/Photos /mnt/FotoSanDisk/thumbnails /mnt/FotoSanDisk/trash

services:
  viewphoto:
    build: .
    container_name: ViewPhotoApp
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      TZ: Europe/Rome
      PHOTOS_DIR: /photos
      THUMBNAILS_DIR: /thumbnails
      TRASH_DIR: /trash
      DATA_DIR: /data
    volumes:
      - /mnt/FotoSanDisk/Photos:/photos
      - /mnt/FotoSanDisk/thumbnails:/thumbnails
      - /mnt/FotoSanDisk/trash:/trash
      - ./data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3001/api/health',(r)=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
