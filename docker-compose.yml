# ViewPhoto Mini Server — Docker Compose
# Start: docker compose up -d --build
# Default port 3001 (change in .env if needed).
#
# First-time setup: bash scripts/setup-server.sh
# External disk:   cp docker-compose.override.example.yml docker-compose.override.yml

services:
  viewphoto:
    build: .
    container_name: viewphoto
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    env_file:
      - .env
    environment:
      TZ: ${TZ:-UTC}
      PHOTOS_DIR: /photos
      THUMBNAILS_DIR: /thumbnails
      TRASH_DIR: /trash
      DATA_DIR: /data
    volumes:
      - ./Photos:/photos
      - ./thumbnails:/thumbnails
      - ./.trash:/trash
      - ./data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3001/api/health',(r)=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
