# Copy to docker-compose.override.yml (gitignored) to store photos on an external disk.
#
#   cp docker-compose.override.example.yml docker-compose.override.yml
#   sudo mkdir -p /mnt/usb/Photos /mnt/usb/thumbnails /mnt/usb/trash
#   sudo chown -R "$USER:$USER" /mnt/usb
#   docker compose up -d --build
#
# Edit the host paths below to match your mount point (USB, NAS, etc.).
# ./data stays in the project folder for album covers and EXIF metadata.

services:
  viewphoto:
    volumes:
      - /mnt/usb/Photos:/photos
      - /mnt/usb/thumbnails:/thumbnails
      - /mnt/usb/trash:/trash
      - ./data:/data
